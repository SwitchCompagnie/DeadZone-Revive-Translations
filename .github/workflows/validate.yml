name: Validate translations

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate every language file
        run: |
          status=0
          for f in translations_*.json; do
            echo "== $f =="
            python3 tools/validate_translation.py "$f" || status=1
          done
          exit $status
